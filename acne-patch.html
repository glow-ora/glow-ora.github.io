<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbyv7HM56z4VMYpwQJrIhmVyikCgUNe0sBg69WJf3OP6txrPsmZOhAyMJREzKoLKBTU5/exec";
  const basePrice = 150;

  const productConfig = {
    productName: "Hydrocolloid Acne Patch",
    optionLabels: {
      type: "Patch Type",
      variantByType: {
        star: "Choose Color",
        cartoon: "Choose Design"
      }
    }
  };

  let currentSlide = 0;
  let selectedType = "star";
  let selectedVariantIndex = null;

  const images = [
    "images/acne-patch-main.jpg",
    "images/acne-patch-2.jpg",
    "images/acne-patch-3.jpg",
    "images/acne-patch-4.jpg"
  ];

  const productData = {
    star: [
      { name: "Green", stock: 0, image: "images/acne-patch-main.jpg" },
      { name: "Olive", stock: 1, image: "images/acne-patch-2.jpg" },
      { name: "Pink", stock: 1, image: "images/acne-patch-3.jpg" },
      { name: "Black", stock: 0, image: "images/acne-patch-4.jpg" },
      { name: "Yellow", stock: 1, image: "images/acne-patch-2.jpg" },
      { name: "Transparent", stock: 0, image: "images/acne-patch-main.jpg" }
    ],
    cartoon: [
      { name: "Hello Kitty", stock: 6, image: "images/acne-patch-3.jpg" },
      { name: "Cute Cat", stock: 2, image: "images/acne-patch-4.jpg" }
    ]
  };

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function updateCartCount() {
    const countEl = document.getElementById("cart-count");
    if (!countEl) return;
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    countEl.textContent = count;
  }

  function formatTypeName(type) {
    return type
      .split("-")
      .map(word => word.charAt(0).toUpperCase() + word.slice(1))
      .join(" ");
  }

  function getSelectedVariant() {
    if (selectedVariantIndex === null) return null;
    return productData[selectedType][selectedVariantIndex];
  }

  function getUsedCount(type, name) {
    return cart
      .filter(item => item.id === "acne" && item.type === type && item.variantName === name)
      .reduce((sum, item) => sum + item.quantity, 0);
  }

  function updateSlider() {
    document.getElementById("mainImage").src = images[currentSlide];
    document.getElementById("slideCount").innerText = (currentSlide + 1) + " / " + images.length;
    document.querySelectorAll(".thumb").forEach((thumb, index) => {
      thumb.classList.toggle("active", index === currentSlide);
    });
  }

  function showSlide(index) {
    currentSlide = index;
    updateSlider();
  }

  function nextSlide() {
    currentSlide = (currentSlide + 1) % images.length;
    updateSlider();
  }

  function prevSlide() {
    currentSlide = (currentSlide - 1 + images.length) % images.length;
    updateSlider();
  }

  function selectType(type) {
    selectedType = type;
    selectedVariantIndex = null;
    document.getElementById("qty").value = 1;

    document.querySelectorAll("#typeButtons .option-btn").forEach(btn => btn.classList.remove("active"));
    const activeTypeBtn = document.querySelector('[data-type="' + type + '"]');
    if (activeTypeBtn) activeTypeBtn.classList.add("active");

    updateVariantLabel();
    renderVariants();
    resetStatus();
    updateSelectedPreview();
    clearMessage();
  }

  function updateVariantLabel() {
    const variantLabel = document.getElementById("variantLabel");
    variantLabel.innerText = productConfig.optionLabels.variantByType[selectedType] || "Choose Option";
  }

  function renderVariants() {
    const variantButtons = document.getElementById("variantButtons");
    const stockList = document.getElementById("stockList");
    variantButtons.innerHTML = "";
    stockList.innerHTML = "";

    productData[selectedType].forEach((item, index) => {
      const remaining = item.stock - getUsedCount(selectedType, item.name);

      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.innerText = item.name;

      if (remaining <= 0) {
        btn.classList.add("disabled");
        btn.disabled = true;
      } else {
        btn.onclick = function () { selectVariant(index); };
      }

      variantButtons.appendChild(btn);

      const row = document.createElement("div");
      row.className = "stock-item";
      row.innerHTML =
        '<span>' + item.name + '</span>' +
        '<span class="stock-badge ' + (remaining > 0 ? 'in-stock' : 'out-stock') + '">' +
        (remaining > 0 ? 'In Stock (' + remaining + ')' : 'Out of Stock') +
        '</span>';

      stockList.appendChild(row);
    });
  }

  function selectVariant(index) {
    selectedVariantIndex = index;

    document.querySelectorAll("#variantButtons .option-btn").forEach((btn, i) => {
      btn.classList.toggle("active", i === index);
    });

    const variant = getSelectedVariant();
    const remaining = variant.stock - getUsedCount(selectedType, variant.name);

    document.getElementById("qty").value = remaining > 0 ? 1 : 0;
    updateStatus();
    updateImageFromVariant();
    updateSelectedPreview();
    clearMessage();
  }

  function updateStatus() {
    const statusChip = document.getElementById("statusChip");
    const lowStockChip = document.getElementById("lowStockChip");
    const variant = getSelectedVariant();

    if (!variant) {
      resetStatus();
      return;
    }

    const remaining = variant.stock - getUsedCount(selectedType, variant.name);
    statusChip.innerText = formatTypeName(selectedType) + " / " + variant.name + " - " + (remaining > 0 ? "In Stock" : "Out of Stock");
    lowStockChip.style.display = (remaining > 0 && remaining <= 2) ? "inline-block" : "none";
  }

  function resetStatus() {
    document.getElementById("statusChip").innerText = "Select a type and option";
    document.getElementById("lowStockChip").style.display = "none";
  }

  function updateImageFromVariant() {
    const variant = getSelectedVariant();
    if (!variant) return;

    const index = images.indexOf(variant.image);
    if (index !== -1) {
      currentSlide = index;
      updateSlider();
    }
  }

  function increaseQty() {
    const variant = getSelectedVariant();

    if (!variant) {
      showMessage("Please select patch type and option first.", "error");
      return;
    }

    const input = document.getElementById("qty");
    let qty = parseInt(input.value, 10) || 1;
    const remaining = variant.stock - getUsedCount(selectedType, variant.name);

    if (remaining <= 0) {
      showMessage("This option is out of stock.", "error");
      return;
    }

    if (qty < remaining) {
      input.value = qty + 1;
    } else {
      showMessage("Only " + remaining + " piece(s) remaining for this option.", "error");
    }

    updateSelectedPreview();
  }

  function decreaseQty() {
    const input = document.getElementById("qty");
    let qty = parseInt(input.value, 10) || 1;

    if (qty > 1) {
      input.value = qty - 1;
    }

    updateSelectedPreview();
  }

  function updateSelectedPreview() {
    const input = document.getElementById("qty");
    let qty = parseInt(input.value, 10) || 1;
    const variant = getSelectedVariant();

    if (qty < 1) qty = 1;

    if (variant) {
      const remaining = variant.stock - getUsedCount(selectedType, variant.name);

      if (remaining <= 0) {
        qty = 1;
      } else if (qty > remaining) {
        qty = remaining;
      }

      input.value = qty;
      document.getElementById("selectedPreviewText").innerText =
        formatTypeName(selectedType) + " / " + variant.name + " x " + qty;
    } else {
      document.getElementById("selectedPreviewText").innerText = "No item selected";
      input.value = qty;
    }

    document.getElementById("selectedItemTotal").innerText = (qty * basePrice) + "৳";
  }

  function addItemToCart() {
    const variant = getSelectedVariant();

    if (!variant) {
      showMessage("Please select patch type and option first.", "error");
      return;
    }

    const quantity = parseInt(document.getElementById("qty").value, 10) || 1;
    const remaining = variant.stock - getUsedCount(selectedType, variant.name);

    if (remaining <= 0) {
      showMessage("This option is out of stock.", "error");
      return;
    }

    if (quantity > remaining) {
      showMessage("Only " + remaining + " piece(s) remaining for this option.", "error");
      return;
    }

    const uniqueId = "acne-" + selectedType + "-" + variant.name.toLowerCase().replace(/\s+/g, "-");
    const existing = cart.find(item => item.uniqueId === uniqueId);

    if (existing) {
      existing.quantity += quantity;
    } else {
      cart.push({
        uniqueId: uniqueId,
        id: "acne",
        name: "Hydrocolloid Acne Patch",
        type: selectedType,
        variantName: variant.name,
        quantity: quantity,
        price: basePrice,
        image: variant.image,
        description: formatTypeName(selectedType) + " / " + variant.name + " acne patch"
      });
    }

    saveCart();
    updateCartCount();
    renderCartDrawer();
    renderVariants();
    updateStatus();
    clearSelection(false);
    showMessage("Item added to basket.", "success");
    openCartDrawer();
  }

  function clearSelection(showMsg = true) {
    selectedVariantIndex = null;
    document.getElementById("qty").value = 1;
    document.querySelectorAll("#variantButtons .option-btn").forEach(btn => btn.classList.remove("active"));
    resetStatus();
    updateSelectedPreview();

    if (showMsg) clearMessage();
  }

  function calculateSubtotal() {
    return cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
  }

  function calculateDelivery(subtotal) {
    if (subtotal === 0) return 0;
    const areaEl = document.getElementById("deliveryArea");
    const selectedArea = areaEl ? areaEl.value : "dhaka";
    let delivery = selectedArea === "outside" ? 120 : 80;

    const acneQty = cart
      .filter(item => item.id === "acne")
      .reduce((sum, item) => sum + item.quantity, 0);

    if (acneQty >= 4) {
      delivery = 0;
    }

    return delivery;
  }

  function renderCartDrawer() {
    const cartItemsContainer = document.getElementById("cart-items");
    const subtotalEl = document.getElementById("subtotal");
    const deliveryEl = document.getElementById("deliveryTotal");
    const totalEl = document.getElementById("total");

    if (!cartItemsContainer) return;

    cartItemsContainer.innerHTML = "";

    if (cart.length === 0) {
      cartItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
      if (subtotalEl) subtotalEl.textContent = "Subtotal: ৳0";
      if (deliveryEl) deliveryEl.textContent = "Delivery: ৳0";
      if (totalEl) totalEl.textContent = "Total: ৳0";
      return;
    }

    cart.forEach((item) => {
      const itemEl = document.createElement("div");
      itemEl.className = "cart-item-drawer";

      itemEl.innerHTML = `
        <img src="${item.image}" alt="${item.name}" class="cart-item-image-drawer">
        <div class="cart-item-info-drawer">
          <h4>${item.name}</h4>
          <p class="cart-item-desc-drawer">${item.description}</p>
          <p class="cart-item-meta-drawer">Price: ৳${item.price} | Quantity: ${item.quantity}</p>
          <div class="cart-item-actions-drawer">
            <button type="button" class="qty-btn minus-btn" data-id="${item.uniqueId}">-</button>
            <button type="button" class="qty-btn plus-btn" data-id="${item.uniqueId}">+</button>
            <button type="button" class="remove-btn-drawer" data-id="${item.uniqueId}">Remove</button>
          </div>
        </div>
      `;

      cartItemsContainer.appendChild(itemEl);
    });

    const subtotal = calculateSubtotal();
    const delivery = calculateDelivery(subtotal);
    const total = subtotal + delivery;

    if (subtotalEl) subtotalEl.textContent = `Subtotal: ৳${subtotal}`;
    if (deliveryEl) deliveryEl.textContent = `Delivery: ৳${delivery}`;
    if (totalEl) totalEl.textContent = `Total: ৳${total}`;

    document.querySelectorAll(".minus-btn").forEach((button) => {
      button.addEventListener("click", () => {
        changeQuantity(button.dataset.id, -1);
      });
    });

    document.querySelectorAll(".plus-btn").forEach((button) => {
      button.addEventListener("click", () => {
        changeQuantity(button.dataset.id, 1);
      });
    });

    document.querySelectorAll(".remove-btn-drawer").forEach((button) => {
      button.addEventListener("click", () => {
        removeFromCart(button.dataset.id);
      });
    });
  }

  function changeQuantity(uniqueId, change) {
    const item = cart.find(product => product.uniqueId === uniqueId);
    if (!item) return;

    const variantStock = productData[item.type].find(v => v.name === item.variantName);
    if (!variantStock) return;

    const usedByOthers = cart
      .filter(p => p.uniqueId !== uniqueId && p.id === "acne" && p.type === item.type && p.variantName === item.variantName)
      .reduce((sum, p) => sum + p.quantity, 0);

    const maxAllowed = variantStock.stock - usedByOthers;

    if (change > 0 && item.quantity >= maxAllowed) {
      showMessage("No more stock available for this option.", "error");
      return;
    }

    item.quantity += change;

    if (item.quantity <= 0) {
      cart = cart.filter(p => p.uniqueId !== uniqueId);
    }

    saveCart();
    updateCartCount();
    renderCartDrawer();
    renderVariants();
    updateStatus();
  }

  function removeFromCart(uniqueId) {
    cart = cart.filter(item => item.uniqueId !== uniqueId);
    saveCart();
    updateCartCount();
    renderCartDrawer();
    renderVariants();
    updateStatus();
  }

  function clearCart() {
    cart = [];
    saveCart();
    updateCartCount();
    renderCartDrawer();
    renderVariants();
    updateStatus();
  }

  function openCartDrawer() {
    const drawer = document.getElementById("cartDrawer");
    const overlay = document.getElementById("cartOverlay");
    if (!drawer || !overlay) return;

    drawer.classList.remove("hidden");
    overlay.classList.remove("hidden");

    requestAnimationFrame(() => {
      drawer.classList.add("is-visible");
      overlay.classList.add("is-visible");
    });
  }

  function closeCartDrawer() {
    const drawer = document.getElementById("cartDrawer");
    const overlay = document.getElementById("cartOverlay");
    if (!drawer || !overlay) return;

    drawer.classList.remove("is-visible");
    overlay.classList.remove("is-visible");

    setTimeout(() => {
      drawer.classList.add("hidden");
      overlay.classList.add("hidden");
    }, 300);
  }

  async function placeOrder(event) {
    event.preventDefault();

    if (!cart.length) {
      alert("Your cart is empty.");
      return;
    }

    const customerName = document.getElementById("customerName").value.trim();
    const customerPhone = document.getElementById("customerPhone").value.trim();
    const customerAddress = document.getElementById("customerAddress").value.trim();
    const deliveryArea = document.getElementById("deliveryArea").value;

    if (!customerName || !customerPhone || !customerAddress) {
      alert("Please fill in your name, phone, and address.");
      return;
    }

    if (!/^01[0-9]{9}$/.test(customerPhone)) {
      alert("Please enter a valid phone number.");
      return;
    }

    const subtotal = calculateSubtotal();
    const delivery = calculateDelivery(subtotal);
    const total = subtotal + delivery;

    const payload = {
      customerName: customerName,
      phone: customerPhone,
      address: customerAddress,
      notes: "",
      items: JSON.stringify(cart),
      subtotal: subtotal,
      deliveryArea: deliveryArea === "outside" ? "Outside Dhaka - 120 tk" : "Inside Dhaka - 80 tk",
      deliveryCharge: delivery,
      totalAmount: total
    };

    try {
      const response = await fetch(scriptURL, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: new URLSearchParams(payload).toString()
      });

      const text = (await response.text()).trim();

      if (text && text.toLowerCase() !== "success") {
        try {
          const result = JSON.parse(text);
          if (result.success === false) {
            throw new Error(result.message || "Order submission failed.");
          }
        } catch (e) {
          if (text.toLowerCase() !== "success") {
            throw new Error("Server returned invalid response: " + text);
          }
        }
      }

      alert("Order placed successfully!");
      clearCart();
      document.getElementById("orderForm").reset();
      closeCartDrawer();
      clearSelection(false);
    } catch (error) {
      alert("Submission failed: " + error.message);
      console.error(error);
    }
  }

  function showMessage(text, type) {
    const box = document.getElementById("messageBox");
    box.className = "message " + type;
    box.innerText = text;
  }

  function clearMessage() {
    const box = document.getElementById("messageBox");
    box.className = "message";
    box.innerText = "";
  }

  let touchStartX = 0;
  let touchEndX = 0;
  const sliderArea = document.getElementById("sliderArea");

  sliderArea.addEventListener("touchstart", function (e) {
    touchStartX = e.changedTouches[0].screenX;
  });

  sliderArea.addEventListener("touchend", function (e) {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  });

  function handleSwipe() {
    if (touchEndX < touchStartX - 40) nextSlide();
    if (touchEndX > touchStartX + 40) prevSlide();
  }

  document.getElementById("typeLabel").innerText = productConfig.optionLabels.type;

  const closeCartBtn = document.getElementById("closeCartBtn");
  const cartOverlay = document.getElementById("cartOverlay");
  const orderForm = document.getElementById("orderForm");
  const deliveryAreaSelect = document.getElementById("deliveryArea");

  if (closeCartBtn) {
    closeCartBtn.addEventListener("click", closeCartDrawer);
  }

  if (cartOverlay) {
    cartOverlay.addEventListener("click", closeCartDrawer);
  }

  if (deliveryAreaSelect) {
    deliveryAreaSelect.addEventListener("change", renderCartDrawer);
  }

  if (orderForm) {
    orderForm.addEventListener("submit", placeOrder);
  }

  updateSlider();
  updateVariantLabel();
  renderVariants();
  updateSelectedPreview();
  updateCartCount();
  renderCartDrawer();

  window.showSlide = showSlide;
  window.nextSlide = nextSlide;
  window.prevSlide = prevSlide;
  window.selectType = selectType;
  window.increaseQty = increaseQty;
  window.decreaseQty = decreaseQty;
  window.addItemToCart = addItemToCart;
  window.clearSelection = clearSelection;
  window.openCartDrawer = openCartDrawer;
  window.clearCart = clearCart;
</script>
